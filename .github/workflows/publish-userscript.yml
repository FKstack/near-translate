name: Publish userscript

on:
  release:
    types: [published]
  workflow_call:
    inputs:
      release_tag:
        description: Already published stable Release tag
        required: true
        type: string
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing stable Release tag to rebuild and republish (vX.Y.Z)
        required: true
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
  GH_TOKEN: ${{ github.token }}

jobs:
  build:
    if: github.event_name != 'release' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      publish_userscripts: ${{ steps.scope.outputs.publish_userscripts }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.event.release.tag_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Verify Release, source commit and package versions
        run: node scripts/verify-release.mjs
      - name: Read publication scope from the tagged version's release notes
        id: scope
        run: node scripts/release-scope.mjs
      - run: npm ci
      - run: npm run check:repo
      - run: npm run check:docs
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:boundaries
      - name: Build and package the original Chrome extension
        run: npm run zip
      - name: Build and package the original Edge extension
        run: npm run zip:edge
      - run: npm run build:userscript
      - run: npm run build:greasyfork
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test -c playwright.userscript.config.ts
      - run: npx playwright test -c playwright.greasyfork.config.ts
      - name: Prepare versioned Release assets and checksums
        run: node scripts/prepare-release-assets.mjs
      - name: Attach the scoped, tested distributions to the existing Release
        run: gh release upload "$RELEASE_TAG" .output/release-assets/* --clobber
      - uses: actions/configure-pages@v5
        if: steps.scope.outputs.publish_userscripts == 'true'
      - name: Upload installable userscript
        if: steps.scope.outputs.publish_userscripts == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: near-translate-userscript
          path: .output/userscript/
          if-no-files-found: error
      - name: Upload Greasy Fork distribution
        if: steps.scope.outputs.publish_userscripts == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: near-translate-greasyfork
          path: .output/greasyfork/
          if-no-files-found: error
      - name: Upload complete Release distributions
        uses: actions/upload-artifact@v4
        with:
          name: near-translate-release-assets
          path: .output/release-assets/
          if-no-files-found: error
      - uses: actions/upload-pages-artifact@v4
        if: steps.scope.outputs.publish_userscripts == 'true'
        with:
          path: .output/userscript-site
      - name: Report extension-only publication
        if: steps.scope.outputs.publish_userscripts == 'false'
        run: |
          {
            echo '## Extension-only publication'
            echo
            echo "Release: $RELEASE_TAG"
            echo 'Chrome and Edge ZIPs, the release manifest and checksums were attached.'
            echo 'Userscript builds were tested but were not uploaded. Pages and the existing GitHub/Greasy Fork update sources were not deployed.'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: build
    if: needs.build.outputs.publish_userscripts == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.event.release.tag_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Prevent an older queued publication from replacing a newer Release
        run: node scripts/verify-release.mjs
      - uses: actions/download-artifact@v4
        with:
          name: near-translate-userscript
          path: .output/userscript
      - uses: actions/download-artifact@v4
        with:
          name: near-translate-greasyfork
          path: .output/greasyfork
      - name: Deploy userscript installation and update files
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify that public update sources match the tested files
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: node scripts/verify-published-userscript.mjs
      - name: Report Greasy Fork synchronization status
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          {
            echo "## Publication deployed"
            echo
            echo "Release: $RELEASE_TAG"
            echo "Pages: $PAGE_URL"
            echo
            echo 'Greasy Fork polls its configured Pages source automatically. Deployment updates that source; Greasy Fork may still be showing the previous version until its next synchronization.'
            echo 'Verify the published script and synchronization status: https://greasyfork.org/scripts/601973'
          } >> "$GITHUB_STEP_SUMMARY"
